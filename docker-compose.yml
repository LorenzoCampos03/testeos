services:
  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    image: as232s5-backend:latest
    container_name: as232s5_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    image: lorenzo01/as232s5-frontend:latest
    container_name: as232s5_frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      # Variable APIURL que conecta el frontend con el backend
      - VITE_API_URL=http://backend:8080
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

configs:
  nginx_config:
    content: |
      server {
          listen 80;
          server_name localhost;
          
          root /usr/share/nginx/html;
          index index.html;

          # Configuración para servir el frontend
          location / {
              try_files $$uri $$uri/ /index.html;
          }

          # Proxy para las peticiones del API al backend
          location /api/ {
              proxy_pass http://backend:8080/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              
              # Headers CORS
              add_header Access-Control-Allow-Origin * always;
              add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
              add_header Access-Control-Allow-Headers "*" always;
              
              # Timeouts
              proxy_connect_timeout 60s;
              proxy_send_timeout 60s;
              proxy_read_timeout 60s;
          }

          # Manejo de errores
          error_page 404 /index.html;
      }

networks:
  default:
    name: as232s5_network


